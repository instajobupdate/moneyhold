<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6f5e" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>moneyhold</title>
  <style>
    :root { --bg:#f5f7f6; --card:#ffffff; --text:#1d2b27; --muted:#6b7b76; --brand:#2f6f5e; --danger:#b3261e; --ok:#1e7a3c; --border:#dfe6e3; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px); }
    header { background:var(--brand); color:#fff; padding:16px; display:flex; justify-content:space-between; align-items:center; }
    header h1 { font-size:20px; margin:0; }
    main { max-width:520px; margin:0 auto; padding:16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
    h2 { font-size:17px; margin:0 0 12px; }
    label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
    input, select, textarea, button { width:100%; font-size:16px; padding:12px; border-radius:8px; border:1px solid var(--border); font-family:inherit; }
    button { background:var(--brand); color:#fff; border:none; font-weight:600; margin-top:14px; cursor:pointer; }
    button.secondary { background:#fff; color:var(--brand); border:1px solid var(--brand); }
    button:disabled { opacity:.6; }
    .row { display:flex; gap:10px; }
    .row > * { flex:1; }
    .toggle { display:flex; gap:8px; margin-top:6px; }
    .toggle button { margin:0; background:#fff; color:var(--text); border:1px solid var(--border); }
    .toggle button.active { background:var(--brand); color:#fff; border-color:var(--brand); }
    .stat { display:flex; justify-content:space-between; padding:6px 0; font-size:15px; }
    .stat b { font-variant-numeric: tabular-nums; }
    .income { color:var(--ok); }
    .expense { color:var(--danger); }
    .entry { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; gap:8px; }
    .entry:last-child { border-bottom:none; }
    .entry small { color:var(--muted); display:block; }
    .msg { font-size:14px; margin-top:10px; min-height:18px; }
    .msg.error { color:var(--danger); }
    .hidden { display:none !important; }
    .muted { color:var(--muted); font-size:14px; }
  </style>
</head>
<body>

<header>
  <h1>moneyhold</h1>
  <button id="logoutBtn" class="secondary hidden" style="width:auto;margin:0;padding:8px 12px;font-size:14px;">Logout</button>
</header>

<main>
  <!-- LOGIN SCREEN -->
  <section id="authScreen" class="card hidden">
    <h2>Login / Sign up</h2>
    <label>Email</label>
    <input id="email" type="email" autocomplete="email" />
    <label>Password (kam se kam 6 characters)</label>
    <input id="password" type="password" autocomplete="current-password" />
    <div class="row">
      <button id="loginBtn">Login</button>
      <button id="signupBtn" class="secondary">Sign up</button>
    </div>
    <div id="authMsg" class="msg"></div>
  </section>

  <!-- APP SCREEN -->
  <section id="appScreen" class="hidden">
    <div class="card">
      <h2 id="monthTitle">Is mahine ka hisaab</h2>
      <div class="stat"><span>Kamaai (income)</span><b id="totalIncome" class="income">₹0</b></div>
      <div class="stat"><span>Kharcha (expense)</span><b id="totalExpense" class="expense">₹0</b></div>
      <div class="stat"><span>Bacha hua</span><b id="totalLeft">₹0</b></div>
    </div>

    <div class="card">
      <h2>Nayi entry</h2>
      <div class="toggle">
        <button id="typeExpense" class="active">Kharcha</button>
        <button id="typeIncome">Kamaai</button>
      </div>

      <label>Amount (₹)</label>
      <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="e.g. 50" />

      <label>Date</label>
      <input id="date" type="date" />

      <div class="row">
        <div>
          <label>Account</label>
          <select id="accountSelect"></select>
        </div>
        <div>
          <label>Category</label>
          <select id="categorySelect"></select>
        </div>
      </div>

      <label>Note (optional)</label>
      <input id="note" maxlength="280" placeholder="e.g. chai, petrol" />

      <button id="saveBtn">Save</button>
      <div id="saveMsg" class="msg"></div>
    </div>

    <div class="card">
      <h2>Recent entries</h2>
      <div id="entries"><p class="muted">Abhi koi entry nahi hai.</p></div>
    </div>
  </section>
</main>

<!-- Supabase library (pinned version) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let accounts = [];      // [{id, name, account_type}]
  let categories = [];    // [{id, name}]
  let txType = 'expense';

  const $ = (id) => document.getElementById(id);
  const rupees = (n) => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });

  function showMsg(el, text, isError) {
    el.textContent = text || '';
    el.className = 'msg' + (isError ? ' error' : '');
  }

  function monthRange(date = new Date()) {
    const start = new Date(date.getFullYear(), date.getMonth(), 1);
    const end = new Date(date.getFullYear(), date.getMonth() + 1, 0);
    const iso = (d) => d.toISOString().slice(0, 10);
    return { start: iso(start), end: iso(end), label: date.toLocaleString('en-IN', { month: 'long', year: 'numeric' }) };
  }

  function todayIso() {
    const d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }

  // ---------- AUTH ----------
  async function signUp() {
    const email = $('email').value.trim();
    const password = $('password').value;
    showMsg($('authMsg'), 'Account ban raha hai...');
    const { error } = await sb.auth.signUp({ email, password });
    if (error) return showMsg($('authMsg'), error.message, true);
    showMsg($('authMsg'), 'Account ban gaya. Ab Login karo (email confirmation ho to pehle mail check karo).');
  }

  async function logIn() {
    const email = $('email').value.trim();
    const password = $('password').value;
    showMsg($('authMsg'), 'Login ho raha hai...');
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return showMsg($('authMsg'), error.message, true);
  }

  async function logOut() {
    await sb.auth.signOut();
  }

  // ---------- DATA ----------
  async function loadLookups() {
    const [acc, cat] = await Promise.all([
      sb.from('accounts').select('id,name,account_type').eq('is_archived', false).order('name'),
      sb.from('categories').select('id,name').eq('is_archived', false).order('name')
    ]);
    if (acc.error) throw acc.error;
    if (cat.error) throw cat.error;
    accounts = acc.data;
    categories = cat.data;

    $('accountSelect').innerHTML = accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
    $('categorySelect').innerHTML = '<option value="">-- None --</option>' +
      categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  }

  async function loadMonthSummary() {
    const m = monthRange();
    $('monthTitle').textContent = `${m.label} ka hisaab`;
    const { data, error } = await sb.from('transactions')
      .select('amount,transaction_type')
      .gte('transaction_date', m.start)
      .lte('transaction_date', m.end)
      .neq('transaction_type', 'transfer');
    if (error) throw error;

    let income = 0, expense = 0;
    data.forEach(t => t.transaction_type === 'income' ? income += Number(t.amount) : expense += Number(t.amount));
    $('totalIncome').textContent = rupees(income);
    $('totalExpense').textContent = rupees(expense);
    $('totalLeft').textContent = rupees(income - expense);
    $('totalLeft').className = (income - expense) >= 0 ? 'income' : 'expense';
  }

  async function loadRecent() {
    const { data, error } = await sb.from('transactions')
      .select('id,amount,transaction_type,transaction_date,note,categories(name)')
      .order('transaction_date', { ascending: false })
      .order('created_at', { ascending: false })
      .limit(15);
    if (error) throw error;

    const box = $('entries');
    box.innerHTML = '';
    if (!data.length) {
      box.innerHTML = '<p class="muted">Abhi koi entry nahi hai.</p>';
      return;
    }
    data.forEach(t => {
      const row = document.createElement('div');
      row.className = 'entry';
      const left = document.createElement('div');
      const title = document.createElement('div');
      title.textContent = (t.categories && t.categories.name) || (t.transaction_type === 'income' ? 'Kamaai' : 'Kharcha');
      const sub = document.createElement('small');
      sub.textContent = [t.transaction_date, t.note].filter(Boolean).join(' • ');
      left.append(title, sub);
      const amt = document.createElement('b');
      amt.className = t.transaction_type === 'income' ? 'income' : 'expense';
      amt.textContent = (t.transaction_type === 'income' ? '+' : '-') + rupees(t.amount);
      row.append(left, amt);
      box.append(row);
    });
  }

  async function refreshAll() {
    await loadLookups();
    await Promise.all([loadMonthSummary(), loadRecent()]);
  }

  async function saveEntry() {
    const amount = parseFloat($('amount').value);
    if (!amount || amount <= 0) return showMsg($('saveMsg'), 'Amount sahi daalo (0 se zyada).', true);

    const accountId = $('accountSelect').value;
    const account = accounts.find(a => a.id === accountId);
    if (!account) return showMsg($('saveMsg'), 'Account chuno.', true);

    const payload = {
      user_id: currentUser.id,
      client_id: crypto.randomUUID(),           // retry-safe: same entry can't be saved twice
      transaction_type: txType,
      amount: amount,
      transaction_date: $('date').value || todayIso(),
      account_id: accountId,
      payment_mode: account.account_type,       // cash / upi / bank / card
      category_id: $('categorySelect').value || null,
      note: $('note').value.trim() || null
    };

    $('saveBtn').disabled = true;
    const { error } = await sb.from('transactions').insert(payload);
    $('saveBtn').disabled = false;

    if (error) return showMsg($('saveMsg'), 'Save nahi hua: ' + error.message, true);

    showMsg($('saveMsg'), 'Save ho gaya ✔');
    $('amount').value = '';
    $('note').value = '';
    await Promise.all([loadMonthSummary(), loadRecent()]);
  }

  // ---------- UI WIRING ----------
  function setType(t) {
    txType = t;
    $('typeExpense').classList.toggle('active', t === 'expense');
    $('typeIncome').classList.toggle('active', t === 'income');
  }

  function showScreen(loggedIn) {
    $('authScreen').classList.toggle('hidden', loggedIn);
    $('appScreen').classList.toggle('hidden', !loggedIn);
    $('logoutBtn').classList.toggle('hidden', !loggedIn);
  }

  $('loginBtn').onclick = logIn;
  $('signupBtn').onclick = signUp;
  $('logoutBtn').onclick = logOut;
  $('saveBtn').onclick = saveEntry;
  $('typeExpense').onclick = () => setType('expense');
  $('typeIncome').onclick = () => setType('income');

  sb.auth.onAuthStateChange(async (_event, session) => {
    currentUser = session ? session.user : null;
    showScreen(!!currentUser);
    if (currentUser) {
      $('date').value = todayIso();
      try { await refreshAll(); }
      catch (e) { showMsg($('saveMsg'), 'Data load nahi hua: ' + e.message, true); }
    }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
